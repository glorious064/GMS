# Data Settings
phase: train
pickle_file_path: ./Dataset/busi/busi_train_test_names.pkl
snapshot_path: ./ckpt/busi_v2/

# Training Settings
epochs: 1000
GPUs: [0]
num_workers: 8
batch_size: 8
save_freq: 25
seed: 2333

# Model Settings
model_type: v2          # v1 = original ResAttnUNet_DS, v2 = ASPP + Transformer
use_aspp: true          # Improvement 1
use_transformer: true   # Improvement 3
transformer_heads: 4
transformer_spatial: 28 # VAE 224/8 = 28 latent size

in_channel: 4
out_channels: 4
num_res_blocks: 2
ch: 32
ch_mult: [1,2,4,4]

# Optimizer Settings
lr: 0.002

# Loss Settings
w_rec: 1
w_dice: 1
